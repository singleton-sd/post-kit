# Path-aware release: bump workspace package.json versions, update CHANGELOG.md,
# commit `chore(release): Release package versions [skip ci]`, push that commit
# to main plus annotated tags (singleton-release GitHub App), then npm Trusted
# Publishing (OIDC) and GitHub Releases.
#
# Loop prevention is by commit message, not by actor. The singleton-release
# App is on the main ruleset bypass list so the commit-back push is not GH013'd.
# Never fall back to GITHUB_TOKEN for that push.
# Checkout uses persist-credentials: false; the App token is applied to the
# git remote only in the Release step (same pattern as poc-inkads-epaper-renderer).
#
# Auth: job-level id-token: write (npm OIDC) + contents: read. Push/tags/gh
# use the App installation token. No NPM_TOKEN / PAT.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):') }}"
    runs-on: ubuntu-latest
    name: Publish changed packages
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require singleton-release app credentials
        env:
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${RELEASE_APP_ID:-}" ]; then
            echo "::error::Missing repository variable RELEASE_APP_ID (GitHub App singleton-release)."
            missing=1
          fi
          if [ -z "${RELEASE_APP_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing repository secret RELEASE_APP_PRIVATE_KEY (GitHub App singleton-release)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Refusing to run release: singleton-release must push to main. Never falling back to GITHUB_TOKEN."
            exit 1
          fi

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: singleton-sd
          repositories: post-kit
          permission-contents: write

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # Keep the write token out of git config until the Release step.
          persist-credentials: false

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match root package.json "packageManager" (pnpm/action-setup
          # errors if both disagree). npm ≥11 for OIDC is installed below.
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          # Do NOT set registry-url — Trusted Publishing uses OIDC; setup-node
          # would write ~/.npmrc with always-auth and an empty _authToken, which
          # npm ≥11.5 rejects (see engineering/publish-npm-library).

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC publish
        run: |
          set -euo pipefail
          # Pin npm@11: npm@latest may jump majors and break publish argv.
          npm install -g npm@11
          npm --version
          for npmrc in "$PWD/.npmrc" "$(npm config get userconfig)" "$(npm config get globalconfig)"; do
            if [[ -f "$npmrc" ]] && grep -qE 'always-auth|^//registry\.npmjs\.org|_authToken' "$npmrc"; then
              # Do not print file contents — they may contain credentials.
              echo "Refusing to publish with an auth .npmrc: $npmrc" >&2
              exit 1
            fi
          done

      - name: Configure git identity
        run: |
          set -euo pipefail
          slug="${{ steps.app-token.outputs.app-slug }}"
          app_id="${{ vars.RELEASE_APP_ID }}"
          git config user.name "${slug}[bot]"
          git config user.email "${app_id}+${slug}[bot]@users.noreply.github.com"

      - name: Release changed packages
        id: release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin main --tags
          git checkout -B main origin/main

          tmp=$(mktemp)
          set +e
          pnpm release:ci 2>&1 | tee "$tmp"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q 'Nothing to release' "$tmp"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Release commit and tags pushed' "$tmp"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unexpected release:ci output (no release push and not empty)."
          exit 1
