# Path-aware release: bump workspace package versions on main,
# publish to npmjs via Trusted Publishing (OIDC), then tag + GitHub Releases.
# Skips when the push is already a release commit (avoids loops).
#
# Auth model matches engineering/publish-npm-library and
# singleton-sd/poc-inkads-epaper-renderer (no NPM_TOKEN / registry-url).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: Release') }}"
    runs-on: ubuntu-latest
    name: Bump package versions
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the write token out of git config until the Release step.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          # Must match root package.json "packageManager" (pnpm/action-setup
          # errors if both disagree). npm ≥11 for OIDC is installed below.
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Do NOT set registry-url — Trusted Publishing uses OIDC; setup-node
          # would write ~/.npmrc with always-auth and an empty _authToken, which
          # npm ≥11.5 rejects (see engineering/publish-npm-library).

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC publish
        run: |
          set -euo pipefail
          # Pin npm@11: npm@latest may jump majors and break publish argv.
          npm install -g npm@11
          npm --version
          for npmrc in "$PWD/.npmrc" "$(npm config get userconfig)" "$(npm config get globalconfig)"; do
            if [[ -f "$npmrc" ]] && grep -qE 'always-auth|^//registry\.npmjs\.org|_authToken' "$npmrc"; then
              # Do not print file contents — they may contain credentials.
              echo "Refusing to publish with an auth .npmrc: $npmrc" >&2
              exit 1
            fi
          done

      - name: Configure git identity
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release changed packages
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin main --tags
          git checkout -B main origin/main

          tmp=$(mktemp)
          set +e
          pnpm release:ci 2>&1 | tee "$tmp"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q 'Nothing to release' "$tmp"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Release commit and tags pushed' "$tmp"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unexpected release:ci output (no release push and not empty)."
          exit 1
