# Tag-only release: on merge to main, compute next per-package versions from
# tags, set every workspace package version (last tag or planned bump) in the
# CI workspace only, push tags, publish via npm Trusted Publishing (OIDC),
# then create GitHub Releases.
#
# Never commits or pushes to the default branch (no version-bump or CHANGELOG
# commits) and needs no ruleset bypass. Branch rulesets must target
# refs/heads/main only — not refs/tags/** — so tag pushes are not GH013'd.
#
# Auth model matches engineering/publish-npm-library (no NPM_TOKEN /
# registry-url). Job-level GITHUB_TOKEN is contents: write (tags + Releases)
# plus id-token: write (OIDC). Workflow-level permissions are empty.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish changed packages
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Keep the write token out of git config until the Release step.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          # Must match root package.json "packageManager" (pnpm/action-setup
          # errors if both disagree). npm ≥11 for OIDC is installed below.
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Do NOT set registry-url — Trusted Publishing uses OIDC; setup-node
          # would write ~/.npmrc with always-auth and an empty _authToken, which
          # npm ≥11.5 rejects (see engineering/publish-npm-library).

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC publish
        run: |
          set -euo pipefail
          # Pin npm@11: npm@latest may jump majors and break publish argv.
          npm install -g npm@11
          npm --version
          for npmrc in "$PWD/.npmrc" "$(npm config get userconfig)" "$(npm config get globalconfig)"; do
            if [[ -f "$npmrc" ]] && grep -qE 'always-auth|^//registry\.npmjs\.org|_authToken' "$npmrc"; then
              # Do not print file contents — they may contain credentials.
              echo "Refusing to publish with an auth .npmrc: $npmrc" >&2
              exit 1
            fi
          done

      - name: Configure git identity
        run: |
          set -euo pipefail
          # Annotated tags require a local identity. This job never commits.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release changed packages
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin main --tags

          tmp=$(mktemp)
          set +e
          pnpm release:ci 2>&1 | tee "$tmp"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if grep -q 'Nothing to release' "$tmp"; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q 'Release tags pushed' "$tmp"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Unexpected release:ci output (no tag push and not empty)."
          exit 1
