name: Visual review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: visual-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-review:
    name: visual-review
    runs-on: ubuntu-latest
    steps:
      - name: Detect visual-accepted label
        id: accept
        uses: actions/github-script@v7
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const accepted = labels.some((l) => l.name === "visual-accepted");
            core.setOutput("accepted", accepted ? "true" : "false");
            if (accepted) {
              core.info("Label visual-accepted is present; gate will pass.");
            }

      - name: Accept intentional visual diffs
        if: steps.accept.outputs.accepted == 'true'
        run: |
          echo "visual-accepted label present — clearing visual-review (no rebuild required)."

      - uses: actions/checkout@v4
        if: steps.accept.outputs.accepted != 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        if: steps.accept.outputs.accepted != 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        if: steps.accept.outputs.accepted != 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: steps.accept.outputs.accepted != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build editor package deps
        if: steps.accept.outputs.accepted != 'true'
        run: |
          pnpm --filter @singleton-sd/post-kit-types run build
          pnpm --filter @singleton-sd/post-kit-compiler run build
          pnpm --filter @singleton-sd/post-kit-editor run build

      - name: Build Storybook
        if: steps.accept.outputs.accepted != 'true'
        run: pnpm --filter @singleton-sd/post-kit-editor build-storybook

      - name: Install Playwright Chromium
        if: steps.accept.outputs.accepted != 'true'
        run: pnpm --filter @singleton-sd/post-kit-editor exec playwright install chromium --with-deps

      - name: Capture visual screenshots
        if: steps.accept.outputs.accepted != 'true'
        run: pnpm --filter @singleton-sd/post-kit-editor test:visual

      - name: Visual gate
        if: steps.accept.outputs.accepted != 'true'
        env:
          VISUAL_ACCEPTED: '0'
        run: pnpm --filter @singleton-sd/post-kit-editor test:visual:gate

      - name: Upload visual artifact
        if: steps.accept.outputs.accepted != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-visual
          path: packages/post-kit-editor/test-results/visual
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment visual review link on PR
        if: github.event_name == 'pull_request' && steps.accept.outputs.accepted != 'true' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- post-kit-editor-visual-review -->';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `${runUrl}#artifacts`;
            const manifestPath =
              'packages/post-kit-editor/test-results/visual/manifest.json';
            let summaryLine = '_Capture finished — download the artifact for the HTML report._';
            if (fs.existsSync(manifestPath)) {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              const s = manifest.summary || {};
              const changed = (s.changedStories || []).join(', ') || '—';
              const neu = (s.newStories || []).join(', ') || '—';
              summaryLine = [
                `**${s.unchanged ?? 0}** unchanged · **${s.changed ?? 0}** changed · **${s.new ?? 0}** new`,
                s.changed ? `Changed: \`${changed}\`` : null,
                s.new ? `New: \`${neu}\`` : null,
              ]
                .filter(Boolean)
                .join('\n');
            }
            const body = [
              marker,
              '## Visual review (Storybook)',
              '',
              summaryLine,
              '',
              `1. Open the workflow run: ${runUrl}`,
              `2. Download the **\`editor-visual\`** artifact ([Artifacts section](${artifactUrl}))`,
              '3. Unzip and open **`index.html`** for side-by-side baseline / PR / diff',
              '',
              'To accept intentional diffs: update `packages/post-kit-editor/visual-baselines/` from the artifact `pr/*.png` (prefer CI Linux shots), or add the **`visual-accepted`** label.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
